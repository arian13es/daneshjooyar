    /* required styles */



.leaflet-pane,

.leaflet-tile,

.leaflet-marker-icon,

.leaflet-marker-shadow,

.leaflet-tile-container,

.leaflet-pane > svg,

.leaflet-pane > canvas,

.leaflet-zoom-box,

.leaflet-image-layer,

.leaflet-layer {

	position: absolute;

	left: 0;

	top: 0;

	}

.leaflet-container {

	overflow: hidden;

	}

.leaflet-tile,

.leaflet-marker-icon,

.leaflet-marker-shadow {

	-webkit-user-select: none;

	   -moz-user-select: none;

	        user-select: none;

	  -webkit-user-drag: none;

	}

/* Prevents IE11 from highlighting tiles in blue */

.leaflet-tile::selection {

	background: transparent;

}

/* Safari renders non-retina tile on retina better with this, but Chrome is worse */

.leaflet-safari .leaflet-tile {

	image-rendering: -webkit-optimize-contrast;

	}

/* hack that prevents hw layers "stretching" when loading new tiles */

.leaflet-safari .leaflet-tile-container {

	width: 1600px;

	height: 1600px;

	-webkit-transform-origin: 0 0;

	}

.leaflet-marker-icon,

.leaflet-marker-shadow {

	display: block;

	}

/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */

.leaflet-container .leaflet-overlay-pane svg {

	max-width: none !important;

	max-height: none !important;

	}

.leaflet-container .leaflet-marker-pane img,

.leaflet-container .leaflet-shadow-pane img,

.leaflet-container .leaflet-tile-pane img,

.leaflet-container img.leaflet-image-layer,

.leaflet-container .leaflet-tile {

	max-width: none !important;

	max-height: none !important;

	width: auto;

	padding: 0;

	}



.leaflet-container img.leaflet-tile {

	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */

	mix-blend-mode: plus-lighter;

}



.leaflet-container.leaflet-touch-zoom {

	-ms-touch-action: pan-x pan-y;

	touch-action: pan-x pan-y;

	}

.leaflet-container.leaflet-touch-drag {

	-ms-touch-action: pinch-zoom;

	/* Fallback for FF which doesn't support pinch-zoom */

	touch-action: none;

	touch-action: pinch-zoom;

}

.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {

	-ms-touch-action: none;

	touch-action: none;

}

.leaflet-container {

	-webkit-tap-highlight-color: transparent;

}

.leaflet-container a {

	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);

}

.leaflet-tile {

	filter: inherit;

	visibility: hidden;

	}

.leaflet-tile-loaded {

	visibility: inherit;

	}

.leaflet-zoom-box {

	width: 0;

	height: 0;

	-moz-box-sizing: border-box;

	     box-sizing: border-box;

	z-index: 800;

	}

/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */

.leaflet-overlay-pane svg {

	-moz-user-select: none;

	}



.leaflet-pane         { z-index: 400; }



.leaflet-tile-pane    { z-index: 200; }

.leaflet-overlay-pane { z-index: 400; }

.leaflet-shadow-pane  { z-index: 500; }

.leaflet-marker-pane  { z-index: 600; }

.leaflet-tooltip-pane   { z-index: 650; }

.leaflet-popup-pane   { z-index: 700; }



.leaflet-map-pane canvas { z-index: 100; }

.leaflet-map-pane svg    { z-index: 200; }



.leaflet-vml-shape {

	width: 1px;

	height: 1px;

	}

.lvml {

	behavior: url(#default#VML);

	display: inline-block;

	position: absolute;

	}





/* control positioning */



.leaflet-control {

	position: relative;

	z-index: 800;

	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */

	pointer-events: auto;

	}

.leaflet-top,

.leaflet-bottom {

	position: absolute;

	z-index: 1000;

	pointer-events: none;

	}

.leaflet-top {

	top: 0;

	}

.leaflet-right {

	right: 0;

	}

.leaflet-bottom {

	bottom: 0;

	}

.leaflet-left {

	left: 0;

	}

.leaflet-control {

	float: left;

	clear: both;

	}

.leaflet-right .leaflet-control {

	float: right;

	}

.leaflet-top .leaflet-control {

	margin-top: 10px;

	}

.leaflet-bottom .leaflet-control {

	margin-bottom: 10px;

	}

.leaflet-left .leaflet-control {

	margin-left: 10px;

	}

.leaflet-right .leaflet-control {

	margin-right: 10px;

	}





/* zoom and fade animations */



.leaflet-fade-anim .leaflet-popup {

	opacity: 0;

	-webkit-transition: opacity 0.2s linear;

	   -moz-transition: opacity 0.2s linear;

	        transition: opacity 0.2s linear;

	}

.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {

	opacity: 1;

	}

.leaflet-zoom-animated {

	-webkit-transform-origin: 0 0;

	    -ms-transform-origin: 0 0;

	        transform-origin: 0 0;

	}

svg.leaflet-zoom-animated {

	will-change: transform;

}



.leaflet-zoom-anim .leaflet-zoom-animated {

	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);

	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);

	}

": "#94a3b8", "lat": 38.0571364, "lon": 46.3291875, "desc": ""}, {"id": "poi_168", "name": "مرکز تحصیلات تکمیلی و مدیریت امور آموزشی", "category": "faculty", "cat_label": "دانشکده‌ها و آموزشی", "color": "#38bdf8", "lat": 38.0617855, "lon": 46.3284783, "desc": ""}, {"id": "poi_170", "name": "مرکز نوآوری و اختراعات دانشگاه تبریز", "category": "faculty", "cat_label": "دانشکده‌ها و آموزشی", "color": "#38bdf8", "lat": 38.0558041, "lon": 46.3273366, "desc": ""}, {"id": "poi_173", "name": "مسجد دانشگاه تبربز", "category": "sports_culture", "cat_label": "ورزشی، فرهنگی و مذهبی", "color": "#4ade80", "lat": 38.0633472, "lon": 46.3300143, "desc": ""}, {"id": "poi_175", "name": "معاونت حمل و نقل دانشگاه تبریز", "category": "admin", "cat_label": "اداری، ستادی و خدمات", "color": "#facc15", "lat": 38.0544827, "lon": 46.3269948, "desc": ""}, {"id": "poi_179", "name": "موزه دانشگاه", "category": "research", "cat_label": "کتابخانه و پژوهش", "color": "#22d3ee", "lat": 38.0609806, "lon": 46.3266409, "desc": ""}, {"id": "poi_181", "name": "میدان شهید ارشدی پور", "category": "general", "cat_label": "سایر ابنیه دانشگاه", "color": "#94a3b8", "lat": 38.0568046, "lon": 46.3343682, "desc": ""}, {"id": "poi_184", "name": "نگهبانی", "category": "general", "cat_label": "سایر ابنیه دانشگاه", "color": "#94a3b8", "lat": 38.0572268, "lon": 46.3262606, "desc": ""}, {"id": "poi_189", "name": "ورزشگاه دانشگاه تبریز", "category": "sports_culture", "cat_label": "ورزشی، فرهنگی و مذهبی", "color": "#4ade80", "lat": 38.054121, "lon": 46.3317194, "desc": ""}, {"id": "poi_192", "name": "ورودی خواهران غذاخوری استاد شهریار", "category": "gates", "cat_label": "درب‌ها و حمل و نقل", "color": "#f59e0b", "lat": 38.0576013, "lon": 46.3288991, "desc": ""}, {"id": "poi_193", "name": "ورودی غذاخوری استاد شهریار", "category": "gates", "cat_label": "درب‌ها و حمل و نقل", "color": "#f59e0b", "lat": 38.0583408, "lon": 46.329548, "desc": ""}, {"id": "poi_206", "name": "پلانتاریوم - افلاک نمای دانشگاه تبریز", "category": "research", "cat_label": "کتابخانه و پژوهش", "color": "#22d3ee", "lat": 38.0517705, "lon": 46.3270094, "desc": ""}, {"id": "poi_211", "name": "چمن مصنوعی", "category": "sports_culture", "cat_label": "ورزشی، فرهنگی و مذهبی", "color": "#4ade80", "lat": 38.0546846, "lon": 46.3303757, "desc": ""}, {"id": "poi_212", "name": "ژیمنازیوم", "category": "sports_culture", "cat_label": "ورزشی، فرهنگی و مذهبی", "color": "#4ade80", "lat": 38.0571376, "lon": 46.3315108, "desc": ""}, {"id": "poi_213", "name": "ژیمنازیوم دانشگاه تبریز", "category": "sports_culture", "cat_label": "ورزشی، فرهنگی و مذهبی", "color": "#4ade80", "lat": 38.0575115, "lon": 46.3308826, "desc": ""}, {"id": "poi_215", "name": "کارگاه ماشین، جوشکاری الله", "category": "research", "cat_label": "کتابخانه و پژوهش", "color": "#22d3ee", "lat": 38.0584781, "lon": 46.3388523, "desc": ""}, {"id": "poi_222", "name": "کتابخانه مرکزی دانشگاه تبریز", "category": "research", "cat_label": "کتابخانه و پژوهش", "color": "#22d3ee", "lat": 38.0478533, "lon": 46.3324412, "desc": ""}, {"id": "poi_230", "name": "گروه مهندسی مواد", "category": "faculty", "cat_label": "دانشکده‌ها و آموزشی", "color": "#38bdf8", "lat": 38.0605309, "lon": 46.3266329, "desc": ""}, {"id": "poi_234", "name": "یادمان شهدای گمنام دانشگاه تبریز", "category": "general", "cat_label": "سایر ابنیه دانشگاه", "color": "#94a3b8", "lat": 38.0529679, "lon": 46.3266279, "desc": ""}]};

    const SAT_BOUNDS = [
      [38.045928, 46.322479],
      [38.066474, 46.343079]
    ];

    const CAMPUS_BOUNDS = [
      [38.0465, 46.3245],
      [38.0650, 46.3415]
    ];
    const CAMPUS_CENTER = [38.0565, 46.3325];

    const map = L.map('map', {
      center: CAMPUS_CENTER,
      zoom: 16,
      minZoom: 14,
      maxZoom: 19,
      maxBounds: [
        [38.035, 46.310],
        [38.075, 46.355]
      ],
      zoomControl: false,
      attributionControl: false
    });

    const satOverlay = L.imageOverlay('tabriz_satellite_campus_hd.jpg', SAT_BOUNDS, {
      opacity: 1.0,
      interactive: false,
      zIndex: 1
    }).addTo(map);

    const perimeterLayer = L.polygon(GIS_DATA.perimeter, {
      color: '#38bdf8',
      weight: 2,
      dashArray: '5, 6',
      fillColor: 'transparent',
      fillOpacity: 0,
      interactive: false,
      zIndex: 10
    }).addTo(map);

    const landuseGroup = L.layerGroup().addTo(map);
    const roadsGroup = L.layerGroup().addTo(map);
    const bldgGroup = L.layerGroup().addTo(map);
    const poiGroup = L.layerGroup().addTo(map);

    GIS_DATA.landuse.forEach(lu => {
      L.polygon(lu.coords, {
        color: lu.color || '#22c55e',
        weight: 1.5,
        dashArray: '3, 4',
        fillColor: lu.fill_color || '#22c55e22',
        fillOpacity: 0.25,
        interactive: true
      }).bindTooltip(lu.name, { permanent: false, direction: 'center', className: 'bldg-label' })
        .addTo(landuseGroup);
    });

    GIS_DATA.roads.forEach(rd => {
      L.polyline(rd.coords, {
        color: rd.color || 'rgba(56, 189, 248, 0.45)',
        weight: rd.weight || 2,
        interactive: false
      }).addTo(roadsGroup);
    });

    const bldgLayers = [];
    GIS_DATA.buildings.forEach(b => {
      let poly;
      if (b.coords && b.coords.length > 2) {
        poly = L.polygon(b.coords, {
          color: b.color || '#38bdf8',
          weight: 1.5,
          fillColor: b.color || '#38bdf8',
          fillOpacity: 0.35,
          interactive: true
        });
      } else {
        poly = L.circleMarker([b.lat, b.lon], {
          radius: 8,
          color: b.color || '#38bdf8',
          weight: 2,
          fillColor: b.color || '#38bdf8',
          fillOpacity: 0.5,
          interactive: true
        });
      }

      poly.bindTooltip(b.name, {
        permanent: false,
        direction: 'top',
        className: 'bldg-label',
        offset: [0, -6]
      });

      poly.on('click', () => showDetails(b));
      poly.addTo(bldgGroup);
      bldgLayers.push({ data: b, layer: poly });
    });

    const poiLayers = [];
    GIS_DATA.pois.forEach(p => {
      const iconHtml = `<div class="poi-icon" style="border-color:${p.color || '#38bdf8'};color:${p.color || '#38bdf8'}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>`;
      const markerIcon = L.divIcon({
        html: iconHtml,
        className: '',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
      });
      const marker = L.marker([p.lat, p.lon], { icon: markerIcon });
      marker.bindTooltip(p.name, { permanent: false, direction: 'top', className: 'bldg-label' });
      marker.on('click', () => showDetails(p));
      marker.addTo(poiGroup);
      poiLayers.push({ data: p, layer: marker });
    });

    let selectedItem = null;
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetCategory = document.getElementById('sheetCategory');
    const sheetDesc = document.getElementById('sheetDesc');
    const sheetPhoto = document.getElementById('sheetPhoto');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const clearSearch = document.getElementById('clearSearch');

    function showDetails(item) {
      selectedItem = item;
      sheetTitle.innerText = item.name;
      sheetCategory.innerText = item.cat_label || item.category || 'فضای دانشگاه';
      sheetDesc.innerText = item.desc || (item.name + ' - مستقر در محوطه پردیس اصلی دانشگاه تبریز.');
      
      if (item.photo) {
        sheetPhoto.src = item.photo;
        sheetPhoto.style.display = 'block';
      } else {
        sheetPhoto.style.display = 'none';
      }

      bottomSheet.classList.add('open');
    }

    document.getElementById('sheetClose').addEventListener('click', () => {
      bottomSheet.classList.remove('open');
      selectedItem = null;
    });

    document.getElementById('btnFocus').addEventListener('click', () => {
      if (selectedItem) {
        map.flyTo([selectedItem.lat, selectedItem.lon], 18, { duration: 1.2 });
      }
    });

    document.getElementById('btnRouting').addEventListener('click', () => {
      if (selectedItem) {
        alert('مسیریابی هوشمند داخلی به سمت ' + selectedItem.name + ' فعال شد.');
      }
    });

    document.getElementById('btnCampusCenter').addEventListener('click', () => {
      map.flyToBounds(CAMPUS_BOUNDS, { duration: 1.2 });
    });

    let polygonsVisible = true;
    document.getElementById('btnToggleLayers').addEventListener('click', () => {
      polygonsVisible = !polygonsVisible;
      if (polygonsVisible) {
        bldgGroup.addTo(map);
        landuseGroup.addTo(map);
        perimeterLayer.setStyle({ opacity: 1 });
      } else {
        map.removeLayer(bldgGroup);
        map.removeLayer(landuseGroup);
        perimeterLayer.setStyle({ opacity: 0 });
      }
    });

    document.getElementById('btnLocateMe').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          L.circleMarker([lat, lon], {
            radius: 8,
            color: '#38bdf8',
            fillColor: '#0284c7',
            fillOpacity: 0.9
          }).addTo(map).bindPopup('موقعیت کنونی شما').openPopup();
          map.flyTo([lat, lon], 17);
        }, () => {
          alert('امکان دسترسی به GPS فراهم نیست.');
        });
      }
    });

    const allItems = [...GIS_DATA.buildings, ...GIS_DATA.pois];
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim().toLowerCase();
      if (!query) {
        searchResults.style.display = 'none';
        clearSearch.style.display = 'none';
        return;
      }
      clearSearch.style.display = 'block';
      const matches = allItems.filter(item => 
        (item.name && item.name.toLowerCase().includes(query)) ||
        (item.desc && item.desc.toLowerCase().includes(query))
      ).slice(0, 8);

      if (matches.length === 0) {
        searchResults.innerHTML = '<div style="padding:12px;color:#94a3b8;font-size:13px;text-align:center;">مکانی یافت نشد</div>';
      } else {
        searchResults.innerHTML = matches.map(m => `
          <div class="search-result-item" data-id="${m.id || ''}" data-lat="${m.lat}" data-lon="${m.lon}">
            <span class="item-title">${m.name}</span>
            <span class="item-cat">${m.cat_label || m.category || ''}</span>
          </div>
        `).join('');

        document.querySelectorAll('.search-result-item').forEach((el, idx) => {
          el.addEventListener('click', () => {
            const item = matches[idx];
            showDetails(item);
            map.flyTo([item.lat, item.lon], 18, { duration: 1.2 });
            searchResults.style.display = 'none';
            searchInput.value = item.name;
          });
        });
      }
      searchResults.style.display = 'block';
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.style.display = 'none';
      searchResults.style.display = 'none';
    });

    document.querySelectorAll('.filter-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const cat = chip.getAttribute('data-cat');
        
        bldgLayers.forEach(b => {
          if (cat === 'all' || b.data.category === cat) {
            b.layer.setStyle({ opacity: 1, fillOpacity: 0.35 });
          } else {
            b.layer.setStyle({ opacity: 0.1, fillOpacity: 0.05 });
          }
        });

        poiLayers.forEach(p => {
          if (cat === 'all' || p.data.category === cat) {
            p.layer.setOpacity(1);
          } else {
            p.layer.setOpacity(0.1);
          }
        });
      });
    });
  </script>
</body>
